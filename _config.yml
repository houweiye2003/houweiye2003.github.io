# 网站设置：请填写带“填写”的项目，其余项目通常不需要修改。

# 基本信息
title: Wei-Ye Hou（侯惟晔) # (填写) 左上角以及浏览器 Tab 标题
url: "https://houweiye2003.github.io" # (填写) 网站完整网址，末尾不加 /

# 个人信息与首页设置
params:
  author: "侯惟晔 / Wei-Ye Hou" # (填写) 你的姓名，用于页脚及网页作者信息
  description: "PhD Student Researcher" # (填写) eg. phd/grad student researcher

  # 显示设置
  ShowBreadCrumbs: true # 显示面包屑导航
  ShowCodeCopyButtons: true # 显示代码复制按钮
  ShowOnlySelectedPubs: true # 首页仅展示 selected: true 的论文（设为 false 展示全部）

  homeInfoParams:
    imageUrl: "/images/portrait.webp" # 头像图片的路径
    imageWidth: 120
    imageHeight: 120
    imageTitle: "my portrait" # 头像的文字说明
    # 可选按钮；不需要的按钮可以删除，也可以在每行前加 # 注释掉。
    buttons:
      - name: CV
        url: /cv.pdf # (填写) 将简历命名为 cv.pdf，放在网站根目录
#      - name: Google Scholar
#        url: "https://scholar.google.com/citations?user=xxxx" # (填写) 你的 Google Scholar 主页
#      - name: ORCID
#        url: "https://orcid.org/0000-0000-0000-0000" # (填写) 你的 ORCID 主页
      - name: Research Group
        url: "https://www.iqmlab.org" # (填写) 课题组主页

  # 可选图标链接
  socialIcons:
    - name: github
      url: "https://github.com/houweiye2003" # (填写) 你的 GitHub 主页
      title: "GitHub"
    - name: email
      url: "mailto:230269254@seu.edu.cn" # (填写) 你的电子邮箱，保留 mailto:
      title: "Email"

# 语言设置、分语言的首页介绍与菜单
defaultContentLanguage: zh # 默认进入中文首页；改为 en 则默认进入英文首页
languages:
  zh:
    label: 中文
    locale: zh-CN
    weight: 1
    params:
      homeInfoParams:
        # 中文首页标题 (填写)
        Title: "侯惟晔 / Wei-Ye Hou"
        # 中文首页自我介绍，Markdown 格式 (填写)；保持正文前的空格缩进。
        Content: |
          (Example 1) I am a second-year PhD student at the University of California Merced advised by Prof. Ming-Hsuan Yang. My current research topics are in image and video generation. I’m interested in developing interactable visual intelligence.

          Before my PhD journey, I also worked on visual-language learning with Prof. Winston Hsu at National Taiwan University.
    # 中文可选菜单 (填写)；pageRef 填对应栏目，例如新建 abc/ 后填写 /abc/。
    menu:
      main:
        - name: 科研
          pageRef: /research/
          weight: 30
        - name: 论文
          pageRef: /publications/
          weight: 40
        - name: 关于
          pageRef: /about/
          weight: 60
  en:
    label: English
    locale: en-US
    weight: 2
    params:
      homeInfoParams:
        # 英文首页标题 (填写)
        Title: "Wei-Ye Hou / 侯惟晔"
        # 英文首页自我介绍，Markdown 格式 (填写)；保持正文前的空格缩进。
        Content: |
          (Example 2) I am a professor of economics at the University of California, Santa Cruz. I work primarily on economic slack—which includes unemployed workers, unsold goods and services, and idle capacity. I research why slack prevails in almost all markets, why it fluctuates over the business cycle, and how macroeconomic policies should respond to such fluctuations.
    # 英文可选菜单 (填写)；与中文菜单对应，但名称使用英文。
    menu:
      main:
        - name: Research
          pageRef: /research/
          weight: 30
        - name: Publications
          pageRef: /publications/
          weight: 40
        - name: About
          pageRef: /about/
          weight: 60

# 以下是网站构建设置，通常不需要修改。
baseurl: ""
timezone: Asia/Shanghai
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
defaults:
  - scope:
      path: ""
    values:
      layout: page
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - tests
